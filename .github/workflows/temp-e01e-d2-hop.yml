name: Temporary E01e d2 hop

on:
  pull_request:
    paths:
      - ".github/workflows/temp-e01e-d2-hop.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Trace d2 final hop
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          python3 - <<'PY'
          import requests,time
          from decimal import Decimal,getcontext
          from datetime import datetime,timezone,timedelta
          getcontext().prec=90
          A='0xd2f78dd99c9eea7af493b100cf56854646fb764a';CUT='2026-08-08T00:00:00.000000Z';B='https://eth.blockscout.com/api/v2'
          s=requests.Session();s.headers.update({'user-agent':'Mozilla/5.0','accept':'application/json'})
          def g(path,p=None):
            for i in range(5):
              r=s.get(B+path,params=p,timeout=60)
              if r.status_code==429 or r.status_code>=500:time.sleep(i+1);continue
              r.raise_for_status();return r.json()
            raise RuntimeError(path)
          def h(x):return ((x or {}).get('hash') or '').lower() if isinstance(x,dict) else ''
          def j(st):return datetime.fromisoformat(st.replace('Z','+00:00')).astimezone(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S JST') if st else '-'
          def lab(x):
            x=x or {};z=[]
            for k in ('name','ens_domain_name','implementation_name'):
              if x.get(k):z.append(str(x[k]))
            for k in ('public_tags','watchlist_names'):
              for y in x.get(k) or []:
                if isinstance(y,dict):
                  v=y.get('display_name') or y.get('name') or y.get('label')
                  if v:z.append(str(v))
            return ';'.join(dict.fromkeys(z)) or '-'
          def amount(q):
            total=q.get('total') or {};tok=q.get('token') or {};dec=int(total.get('decimals',tok.get('decimals',0)) or 0)
            return Decimal(str(total.get('value') or 0))/(Decimal(10)**dec)
          def sym(q):return str((q.get('token') or {}).get('symbol') or '?')
          info=g('/addresses/'+A);print('ADDRESS|contract=%s|name=%s|label=%s|coin_balance=%s'%(info.get('is_contract'),info.get('name'),lab(info),info.get('coin_balance')))
          p={};txs=[]
          for page in range(1,15):
            d=g(f'/addresses/{A}/transactions',p);items=d.get('items') or []
            if not items:break
            oldest=None
            for x in items:
              st=x.get('timestamp');oldest=st or oldest
              if st and st>=CUT and h(x.get('from'))==A:txs.append(x)
            n=d.get('next_page_params')
            if not isinstance(n,dict) or not n or (oldest and oldest<CUT):break
            p=n
          print('TX_COUNT|%s'%len(txs))
          for x in sorted(txs,key=lambda z:z.get('timestamp') or ''):
            print('TX|jst=%s|hash=%s|to=%s|contract=%s|label=%s|method=%s|value=%s|status=%s'%(j(x.get('timestamp')),x.get('hash'),h(x.get('to')),(x.get('to') or {}).get('is_contract'),lab(x.get('to')),x.get('method'),x.get('value'),x.get('status')))
            d=g('/transactions/'+x['hash'])
            for q in d.get('token_transfers') or []:
              if h(q.get('from'))==A:print('TOKEN|jst=%s|symbol=%s|amount=%s|to=%s|contract=%s|label=%s|tx=%s'%(j(x.get('timestamp')),sym(q),amount(q),h(q.get('to')),(q.get('to') or {}).get('is_contract'),lab(q.get('to')),x.get('hash')))
          holds=g(f'/addresses/{A}/tokens',{'type':'ERC-20'}).get('items') or []
          for x in holds:
            tok=x.get('token') or {};dec=int(tok.get('decimals') or 0);amt=Decimal(str(x.get('value') or 0))/(Decimal(10)**dec)
            if amt:print('HOLD|symbol=%s|amount=%s|token=%s'%(tok.get('symbol'),amt,tok.get('address_hash')))
          PY
