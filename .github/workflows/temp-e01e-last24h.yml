name: Temporary E01e last 48h

on:
  pull_request:
    paths:
      - ".github/workflows/temp-e01e-last24h.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest transfers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          python3 - <<'PY'
          import requests
          from decimal import Decimal
          from datetime import datetime,timezone,timedelta
          T='0xe01ecff2f6c4f2416e83e6861e8abf79b1c95950';A6='0xa6ae8e0d2e294018dd3e36caf6c828b79236f71d';F5='0xf5947f530b2a67b3d9ef211c10abba06c6c3a836';B='https://eth.blockscout.com/api/v2';CUT='2026-08-10T00:00:00.000000Z'
          s=requests.Session();s.headers.update({'user-agent':'Mozilla/5.0','accept':'application/json'})
          def g(path,p=None):
            r=s.get(B+path,params=p,timeout=60);print('HTTP|%s|%s'%(r.status_code,path));r.raise_for_status();return r.json()
          def h(x):return ((x or {}).get('hash') or '').lower() if isinstance(x,dict) else ''
          def a(x):
            q=x.get('total') or {};t=x.get('token') or {};return Decimal(str(q.get('value') or 0))/(Decimal(10)**int(q.get('decimals',t.get('decimals',0)) or 0))
          def r(x):return Decimal(str((x.get('token') or {}).get('exchange_rate') or 0))
          def sy(x):return str((x.get('token') or {}).get('symbol') or '?')
          def lab(x):
            x=x or {};z=[]
            for k in ('name','ens_domain_name','implementation_name'):
              if x.get(k):z.append(str(x[k]))
            for k in ('public_tags','watchlist_names'):
              for y in x.get(k) or []:
                if isinstance(y,dict):
                  v=y.get('display_name') or y.get('name') or y.get('label')
                  if v:z.append(str(v))
            return ';'.join(dict.fromkeys(z)) or '-'
          def j(st):return datetime.fromisoformat(st.replace('Z','+00:00')).astimezone(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S JST') if st else '-'
          print('SNAPSHOT|%s'%datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9))).isoformat())
          txitems=g(f'/addresses/{T}/transactions').get('items') or []
          sent={x.get('hash'):x for x in txitems if h(x.get('from'))==T and (not x.get('timestamp') or x.get('timestamp')>=CUT)}
          for k,x in sent.items():print('TX|jst=%s|hash=%s|to=%s|contract=%s|label=%s|method=%s|status=%s'%(j(x.get('timestamp')),k,h(x.get('to')),(x.get('to') or {}).get('is_contract'),lab(x.get('to')),x.get('method'),x.get('status')))
          outs=g(f'/addresses/{T}/token-transfers',{'type':'ERC-20','filter':'from'}).get('items') or []
          for x in outs:
            st=x.get('timestamp');hh=x.get('transaction_hash')
            if h(x.get('from'))==T and (not st or st>=CUT):print('TOKEN_OUT|jst=%s|symbol=%s|amount=%s|usd=%s|to=%s|contract=%s|label=%s|tx=%s|top_sent=%s'%(j(st),sy(x),a(x),a(x)*r(x),h(x.get('to')),(x.get('to') or {}).get('is_contract'),lab(x.get('to')),hh,hh in sent))
          holds=g(f'/addresses/{T}/tokens',{'type':'ERC-20'}).get('items') or []
          for x in holds:
            t=x.get('token') or {};d=int(t.get('decimals') or 0);v=Decimal(str(x.get('value') or 0))/(Decimal(10)**d)
            if v:print('HOLD|symbol=%s|amount=%s|usd=%s|token=%s'%(t.get('symbol'),v,v*Decimal(str(t.get('exchange_rate') or 0)),t.get('address_hash')))
          for src in (A6,F5):
            z=g(f'/addresses/{src}/token-transfers',{'type':'ERC-20','filter':'from'}).get('items') or []
            for x in z:
              st=x.get('timestamp')
              if h(x.get('from'))==src and (not st or st>=CUT):print('HOP2|from=%s|jst=%s|symbol=%s|amount=%s|usd=%s|to=%s|contract=%s|label=%s|tx=%s'%(src,j(st),sy(x),a(x),a(x)*r(x),h(x.get('to')),(x.get('to') or {}).get('is_contract'),lab(x.get('to')),x.get('transaction_hash')))
          PY
