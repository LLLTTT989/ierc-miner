          txs=pages('/addresses/'+A+'/transactions',maxp=30)
          for x in sorted(txs,key=lambda z:z.get('timestamp') or ''):
            if h(x.get('from'))==A:print('TX|jst=%s|hash=%s|to=%s|contract=%s|label=%s|method=%s|status=%s'%(j(x.get('timestamp')),x.get('hash'),h(x.get('to')),(x.get('to') or {}).get('is_contract'),lab(x.get('to')),x.get('method'),x.get('status')))
          PY
