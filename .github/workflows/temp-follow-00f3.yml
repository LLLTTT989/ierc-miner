name: Temporary follow 00f3

on:
  pull_request:
    paths:
      - ".github/workflows/temp-follow-00f3.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Trace 00f3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          python3 - <<'PY'
          import requests,time
          from collections import defaultdict
          from decimal import Decimal,getcontext
          from datetime import datetime,timezone,timedelta
          getcontext().prec=90
          A='0x00f3ac32a2d174606927eb17a5d0d221c13e434a';CUT='2026-08-07T00:00:00.000000Z';B='https://eth.blockscout.com/api/v2'
          s=requests.Session();s.headers.update({'user-agent':'Mozilla/5.0','accept':'application/json'})
          def g(path,p=None):
            for i in range(5):
              r=s.get(B+path,params=p,timeout=60)
              if r.status_code==429 or r.status_code>=500:time.sleep(i+1);continue
              r.raise_for_status();return r.json()
            raise RuntimeError(path)
          def pages(path,p=None,maxp=30):
            base=dict(p or {});q=base.copy();o=[]
            for _ in range(maxp):
              d=g(path,q);it=d.get('items') or []
              if not it:break
