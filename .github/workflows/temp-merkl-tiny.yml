name: Temporary Merkl snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/temp-merkl-tiny.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Page all recent distributor transfers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          python3 - <<'PY'
          import requests, json
          from urllib.parse import urlencode
          from decimal import Decimal, getcontext
          getcontext().prec=80
          TARGET='0xe01ecff2f6c4f2416e83e6861e8abf79b1c95950'
          DIST='0x3ef3d8ba38ebe18db133cec108f4d14ce00dd9ae'
          base=f'https://eth.blockscout.com/api/v2/addresses/{TARGET}/token-transfers'
          params={'type':'ERC-20'}
          found=[]; seen=set()
          for page in range(1,101):
            r=requests.get(base,params=params,timeout=60,headers={'user-agent':'Mozilla/5.0','accept':'application/json'})
            print('PAGE|%s|status=%s|url=%s' % (page,r.status_code,r.url))
            r.raise_for_status(); data=r.json(); items=data.get('items') or []
            if not items: break
            oldest=None
            for x in items:
              stamp=x.get('timestamp'); oldest=stamp
              frm=((x.get('from') or {}).get('hash') or '').lower(); to=((x.get('to') or {}).get('hash') or '').lower()
              if frm!=DIST or to!=TARGET: continue
              token=x.get('token') or {}; symbol=token.get('symbol'); total=x.get('total') or {}; raw=Decimal(str(total.get('value') or 0)); dec=int(total.get('decimals') or token.get('decimals') or 18); amount=raw/(Decimal(10)**dec)
              key=(x.get('transaction_hash'),symbol,str(amount))
              if key in seen: continue
              seen.add(key); row={'timestamp':stamp,'tx':x.get('transaction_hash'),'symbol':symbol,'amount':str(amount),'token':token.get('address_hash') or token.get('address'),'block':x.get('block_number')}
              found.append(row); print('DISTRIBUTOR_TRANSFER|%s' % json.dumps(row,ensure_ascii=False,separators=(',',':')))
            print('PAGE_OLDEST|%s|%s' % (page,oldest))
            nxt=data.get('next_page_params')
            if not isinstance(nxt,dict) or not nxt: break
            params={'type':'ERC-20',**nxt}
            # Aqua campaign started July 28; stop once page is safely before it.
            if oldest and oldest < '2026-07-25': break
          print('FOUND_COUNT|%s' % len(found))
          sums={}
          for x in found: sums[x['symbol']]=sums.get(x['symbol'],Decimal(0))+Decimal(x['amount'])
          for symbol,total in sorted(sums.items()): print('FOUND_SUM|symbol=%s|amount=%s' % (symbol,total))
          PY
