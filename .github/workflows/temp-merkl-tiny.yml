name: Temporary Merkl snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/temp-merkl-tiny.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Print recent address activity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          address='0xe01ecff2f6c4f2416e83e6861e8abf79b1c95950'
          distributor='0x3ef3d8ba38ebe18db133cec108f4d14ce00dd9ae'
          urls=[
            ('TX',f'https://eth.blockscout.com/api/v2/addresses/{address}/transactions'),
            ('TOKEN',f'https://eth.blockscout.com/api/v2/addresses/{address}/token-transfers?type=ERC-20'),
          ]
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=45) as r: return r.status,json.loads(r.read())
          for kind,url in urls:
            try: status,data=get(url); print('HTTP|%s|%s|%s' % (kind,status,url))
            except Exception as exc: print('FAIL|%s|%r' % (kind,exc)); continue
            items=data.get('items',[]) if isinstance(data,dict) else []
            print('COUNT|%s|%s' % (kind,len(items)))
            for x in items[:50]:
              if kind=='TX':
                print('TX|timestamp=%s|hash=%s|from=%s|to=%s|method=%s|status=%s|value=%s' % (x.get('timestamp'),x.get('hash'),(x.get('from') or {}).get('hash'),(x.get('to') or {}).get('hash'),x.get('method'),x.get('status'),x.get('value')))
              else:
                frm=((x.get('from') or {}).get('hash') or '').lower(); to=((x.get('to') or {}).get('hash') or '').lower(); tok=x.get('token') or {}
                print('TOKEN|timestamp=%s|tx=%s|symbol=%s|total=%s|from=%s|to=%s|is_distributor=%s' % (x.get('timestamp'),x.get('transaction_hash'),tok.get('symbol'),json.dumps(x.get('total'),separators=(',',':')),frm,to,frm==distributor))
          PY
