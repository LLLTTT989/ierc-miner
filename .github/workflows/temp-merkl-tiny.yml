name: Temporary Merkl snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/temp-merkl-tiny.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Print reward counters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          from decimal import Decimal, getcontext
          getcontext().prec=80
          address='0xe01ecff2f6c4f2416e83e6861e8abf79b1c95950'
          urls=[
            f'https://api.merkl.xyz/v4/users/{address}/rewards?chainId=1&reloadChainId=1',
            f'https://api.merkl.xyz/v4/users/{address}/rewards?chainId=1',
            f'https://api.merkl.fr/v4/users/{address}/rewards?chainId=1&reloadChainId=1',
            f'https://api-merkl.angle.money/v4/users/{address}/rewards?chainId=1&reloadChainId=1',
          ]
          data=None
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as r:
                raw=json.loads(r.read())
                print('ENDPOINT|%s|status=%s' % (url,r.status))
                if isinstance(raw,list): data=raw; break
            except Exception as exc: print('ENDPOINT_FAIL|%s|%r' % (url,exc))
          if data is None: raise SystemExit('no Merkl response')
          count=0
          for chain in data:
            for reward in chain.get('rewards',[]):
              token=reward.get('token') or {}; d=int(token.get('decimals') or 18); scale=Decimal(10)**d
              amount=Decimal(str(reward.get('amount') or 0)); claimed=Decimal(str(reward.get('claimed') or 0)); pending=Decimal(str(reward.get('pending') or 0))
              print('REWARD|symbol=%s|token=%s|credited=%s|claimed=%s|claimable=%s|pending=%s|including_pending=%s|price=%s|breakdown_count=%s' % (
                token.get('symbol'),token.get('address'),amount/scale,claimed/scale,(amount-claimed)/scale,pending/scale,(amount+pending)/scale,token.get('price'),len(reward.get('breakdowns') or [])))
              count+=1
          print('REWARD_COUNT|%s' % count)
          PY
