name: Temporary Merkl snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/temp-merkl-tiny.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Print Aqua opportunity metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          ids=['5490720203734741256','1942106033834367501','10318209568612169509','10469843149341784141','7958717034974323448','16080672482593513037','15798041110823402464','17613018327580788554']
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=45) as r: return r.status,json.loads(r.read())
          for oid in ids:
            found=None
            for url in [f'https://api.merkl.xyz/v4/opportunities/{oid}',f'https://api.merkl.xyz/v4/opportunities?id={oid}&campaigns=true']:
              try:
                status,data=get(url)
                if isinstance(data,list): data=data[0] if data else None
                if isinstance(data,dict): found=(url,status,data); break
              except Exception as exc: print('OPP_FAIL|id=%s|url=%s|error=%r' % (oid,url,exc))
            if not found: continue
            url,status,o=found
            chain=o.get('chain') or {}; protocol=o.get('protocol') or o.get('mainProtocol') or {}; tokens=o.get('tokens') or []
            print('OPPORTUNITY|id=%s|status=%s|url=%s|name=%s|status_field=%s|chain_id=%s|chain_name=%s|protocol=%s|action=%s|type=%s|tokens=%s|explorer=%s' % (
              oid,status,url,o.get('name') or o.get('title'),o.get('status'),chain.get('id') or o.get('chainId'),chain.get('name'),protocol.get('id') or protocol.get('name') or o.get('mainProtocolId'),o.get('action'),o.get('type'),','.join(str((x or {}).get('symbol') or (x or {}).get('address')) for x in tokens if isinstance(x,dict)),o.get('explorerAddress')))
            print('OPP_KEYS|id=%s|keys=%s' % (oid,','.join(sorted(o.keys()))))
          PY
